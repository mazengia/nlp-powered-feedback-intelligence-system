apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: feedback-analyzer-ingress
  namespace: feedback-system
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window-size: "1m"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://yourdomain.com"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/enable-cors: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - api.feedback-analyzer.example.com
    secretName: feedback-analyzer-tls
  rules:
  - host: api.feedback-analyzer.example.com
    http:
      paths:
      - path: /api/v1/feedback
        pathType: Prefix
        backend:
          service:
            name: feedback-analyzer
            port:
              number: 8080
      - path: /actuator
        pathType: Prefix
        backend:
          service:
            name: feedback-analyzer
            port:
              number: 8080
      - path: /swagger-ui.html
        pathType: Exact
        backend:
          service:
            name: feedback-analyzer
            port:
              number: 8080
      - path: /api-docs
        pathType: Prefix
        backend:
          service:
            name: feedback-analyzer
            port:
              number: 8080

