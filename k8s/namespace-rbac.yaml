gapiVersion: v1
kind: Namespace
metadata:
  name: feedback-system
  labels:
    name: feedback-system

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: feedback-analyzer
  namespace: feedback-system

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: feedback-analyzer-role
  namespace: feedback-system
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: feedback-analyzer-rolebinding
  namespace: feedback-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: feedback-analyzer-role
subjects:
- kind: ServiceAccount
  name: feedback-analyzer
  namespace: feedback-system

