apiVersion: v1
kind: Secret
metadata:
  name: feedback-analyzer-secrets
  namespace: feedback-system
type: Opaque
stringData:
  # Database credentials
  db.user: "feedback_user"
  db.password: "CHANGE_ME_IN_PRODUCTION"
  # API keys (if any)
  api.key: "your-api-key-here"
  # Other sensitive data
  jwt.secret: "your-jwt-secret-key-here"

---
# Note: For production, use an external secret management tool:
# - AWS Secrets Manager
# - Azure Key Vault
# - HashiCorp Vault
# - Sealed Secrets (Kubernetes native)
# - External Secrets Operator (ESO)

