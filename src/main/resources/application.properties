# ─── Application ───────────────────────────────────────────────────────────
spring.application.name=customer-feedback-analyzer
server.port=8080

# ─── Database (H2 for dev; replace with MySQL/Postgres for production) ─────
spring.datasource.url=jdbc:h2:mem:feedbackdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ─── NLP Service (Google Colab ngrok URL) ──────────────────────────────────
# Replace with your actual ngrok URL from the Colab notebook
nlp.service.base-url=https://f882-35-252-172-85.ngrok-free.app
nlp.service.timeout-seconds=60
nlp.service.max-batch-size=50

# ─── OpenAPI / Swagger ──────────────────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ─── Logging ────────────────────────────────────────────────────────────────
logging.level.com.feedbackanalyzer=DEBUG
logging.level.org.springframework.web=INFO
