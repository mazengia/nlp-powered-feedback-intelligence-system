spring:
  application:
    name: customer-feedback-analyzer

  datasource:
    url: ${DB_URL:jdbc:h2:mem:feedbackdb;DB_CLOSE_DELAY=-1}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}

  jpa:
    database-platform: ${JPA_DIALECT:org.hibernate.dialect.H2Dialect}
    hibernate:
      ddl-auto: ${DDL_AUTO:create-drop}
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: ${H2_CONSOLE:true}
      path: /h2-console

server:
  port: 8080
  compression:
    enabled: true
    mime-types:
      - application/json
      - application/xml
      - text/html

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    try-it-out-enabled: true

nlp:
  service:
    base-url: ${NLP_BASE_URL:https://c04a-8-229-130-155.ngrok-free.app}
    timeout-seconds: ${NLP_TIMEOUT:60}
    max-batch-size: ${NLP_MAX_BATCH:50}

logging:
  level:
    com.maze.nlpcustomerffeedbackanalyzer: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: WARN